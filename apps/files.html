<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dateien</title>
  <style>
    :root{--ink:#202936;--muted:#697789;--line:#dfe6ed;--soft:#f5f8fb;--blue:#286ee8;--blue-soft:#eaf2ff;--danger:#c53b4a;--shadow:0 8px 24px rgba(34,51,72,.11)}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff}button,input{font:inherit}button{color:inherit}.app{height:100%;display:flex;flex-direction:column;min-width:520px}.toolbar{padding:10px 12px 9px;border-bottom:1px solid var(--line);background:#fff;display:grid;gap:8px}.toolbar-row{display:flex;align-items:center;gap:6px}.icon-btn,.tool-btn{border:1px solid transparent;background:transparent;border-radius:7px;cursor:pointer;min-height:30px}.icon-btn{width:32px;font-size:18px;line-height:1}.icon-btn:hover:not(:disabled),.tool-btn:hover:not(:disabled){background:var(--soft);border-color:var(--line)}button:disabled{opacity:.38;cursor:default}.address{height:32px;min-width:90px;flex:1;display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:0 8px;gap:7px;box-shadow:inset 0 1px 1px rgba(0,0,0,.02)}.address:focus-within{border-color:#8db5f4;box-shadow:0 0 0 3px rgba(40,110,232,.12)}.address span{color:var(--muted);font-size:15px}.address input{border:0;background:transparent;outline:0;min-width:0;flex:1;color:var(--ink)}.tool-btn{border-color:var(--line);background:#fff;padding:5px 9px;white-space:nowrap}.tool-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}.tool-btn.primary:hover{background:#155dcf}.main{min-height:0;flex:1;display:grid;grid-template-columns:174px minmax(260px,1fr) 205px}.sidebar{background:#f8fafc;border-right:1px solid var(--line);padding:12px 8px;overflow:auto}.side-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8490a0;padding:3px 9px 6px}.side-item{width:100%;display:flex;gap:8px;align-items:center;border:0;background:transparent;text-align:left;padding:7px 9px;border-radius:7px;cursor:pointer}.side-item:hover{background:#eaf0f6}.side-item.active{background:var(--blue-soft);color:#165bc7;font-weight:600}.side-item .side-icon{width:17px;text-align:center}.work{min-width:0;min-height:0;display:flex;flex-direction:column}.pathbar{min-height:38px;padding:7px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;overflow:auto;white-space:nowrap}.crumb{border:0;background:transparent;border-radius:5px;padding:3px 5px;cursor:pointer;color:#3b4b5f}.crumb:hover{background:var(--soft);color:var(--blue)}.chevron{color:#a0abba;padding:0 1px}.list-tools{padding:8px 12px;display:flex;gap:7px;border-bottom:1px solid var(--line)}.search{height:30px;flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:0 9px;outline:0}.search:focus{border-color:#8db5f4;box-shadow:0 0 0 3px rgba(40,110,232,.1)}.list{overflow:auto;min-height:0;flex:1;padding:5px 7px}.column-head,.entry{display:grid;grid-template-columns:minmax(160px,1.8fr) 82px 105px;align-items:center;column-gap:10px}.column-head{height:27px;padding:0 9px;color:#7b8999;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.045em;border-bottom:1px solid #eef2f5}.entry{width:100%;height:38px;border:1px solid transparent;border-radius:7px;background:transparent;text-align:left;padding:0 9px;cursor:default}.entry:hover{background:var(--soft)}.entry.selected{background:var(--blue-soft);border-color:#c4dbff}.file-name{display:flex;align-items:center;min-width:0;gap:9px}.file-icon{font-size:18px;width:20px;text-align:center;flex:0 0 auto}.file-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.entry .muted{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{height:100%;min-height:180px;display:grid;place-content:center;text-align:center;color:var(--muted);gap:8px;padding:20px}.empty .empty-icon{font-size:42px}.empty h2{font-size:15px;color:var(--ink);margin:0}.empty p{margin:0;max-width:260px}.preview{border-left:1px solid var(--line);background:#fbfcfe;overflow:auto;padding:13px}.preview h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8490a0;margin:1px 0 13px}.preview-empty{color:var(--muted);font-size:12px;padding-top:12px}.preview-card{display:grid;gap:9px}.preview-icon{font-size:38px}.preview-name{font-weight:650;overflow-wrap:anywhere}.preview-meta{font-size:12px;color:var(--muted);display:grid;gap:3px}.preview-text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:7px;background:#fff;padding:8px;font:11px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;color:#354153}.status{height:28px;border-top:1px solid var(--line);padding:5px 12px;color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:space-between}.clipboard-state{color:var(--blue)}.toast{position:fixed;z-index:20;bottom:12px;left:50%;transform:translate(-50%,20px);max-width:min(420px,calc(100% - 30px));padding:8px 12px;background:#253343;color:#fff;border-radius:8px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.18s ease}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#963340}.menu{position:fixed;z-index:15;min-width:155px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.menu.hidden{display:none}.menu button{display:block;width:100%;border:0;border-radius:5px;background:transparent;text-align:left;padding:6px 8px;cursor:pointer}.menu button:hover{background:var(--soft)}.menu button.danger{color:var(--danger)}dialog{border:0;padding:0;border-radius:12px;box-shadow:0 18px 55px rgba(22,36,53,.28);width:min(380px,calc(100vw - 32px);color:var(--ink)}dialog::backdrop{background:rgba(16,27,39,.26)}.dialog-body{padding:18px}.dialog-body h2{font-size:16px;margin:0 0 6px}.dialog-body p{color:var(--muted);margin:0 0 14px}.dialog-body input{width:100%;height:34px;border:1px solid var(--line);border-radius:7px;padding:0 9px;outline:0}.dialog-body input:focus{border-color:#8db5f4;box-shadow:0 0 0 3px rgba(40,110,232,.1)}.dialog-actions{display:flex;justify-content:flex-end;gap:7px;padding:0 18px 16px}.dialog-actions button{border:1px solid var(--line);border-radius:7px;background:#fff;padding:6px 10px;cursor:pointer}.dialog-actions button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.dialog-actions button.danger{background:var(--danger);border-color:var(--danger);color:#fff}@media(max-width:700px){.main{grid-template-columns:130px minmax(220px,1fr)}.preview{display:none}.toolbar-row.actions .optional{display:none}.column-head,.entry{grid-template-columns:minmax(120px,1fr) 68px}.column-head :last-child,.entry :last-child{display:none}}
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="toolbar-row">
        <button class="icon-btn" id="back" title="Zurück (Alt + ←)" aria-label="Zurück">‹</button>
        <button class="icon-btn" id="forward" title="Vorwärts (Alt + →)" aria-label="Vorwärts">›</button>
        <button class="icon-btn" id="up" title="Übergeordneter Ordner" aria-label="Nach oben">↑</button>
        <form class="address" id="address-form"><span>⌂</span><input id="address" aria-label="Pfad" spellcheck="false" value="/"></form>
        <button class="icon-btn" id="refresh" title="Aktualisieren" aria-label="Aktualisieren">↻</button>
      </div>
      <div class="toolbar-row actions">
        <button class="tool-btn primary" id="new-folder">＋ Ordner</button><button class="tool-btn" id="new-file">＋ Datei</button><button class="tool-btn optional" id="open" disabled>Öffnen</button><button class="tool-btn optional" id="rename" disabled>Umbenennen</button><button class="tool-btn optional" id="copy" disabled>Kopieren</button><button class="tool-btn optional" id="cut" disabled>Ausschneiden</button><button class="tool-btn" id="paste" disabled>Einfügen</button><button class="tool-btn optional" id="download" disabled>Herunterladen</button><button class="tool-btn" id="remove" disabled>Löschen</button>
      </div>
    </header>
    <section class="main">
      <aside class="sidebar"><div class="side-label">Orte</div><div id="places"></div></aside>
      <section class="work"><nav class="pathbar" id="crumbs" aria-label="Pfadnavigation"></nav><div class="list-tools"><input class="search" id="search" placeholder="Diesen Ordner durchsuchen" aria-label="Diesen Ordner durchsuchen"><button class="icon-btn" id="clear-search" title="Suche löschen" aria-label="Suche löschen">×</button></div><div class="list" id="list" tabindex="0"><div class="column-head"><span>Name</span><span>Typ</span><span>Geändert</span></div><div id="entries"></div></div></section>
      <aside class="preview"><h2>Vorschau</h2><div id="preview" class="preview-empty">Wähle eine Datei oder einen Ordner aus.</div></aside>
    </section>
    <footer class="status"><span id="status">Bereit</span><span id="clipboard-status" class="clipboard-state"></span></footer>
  </main>
  <div id="context-menu" class="menu hidden"><button data-menu="open">Öffnen</button><button data-menu="rename">Umbenennen</button><button data-menu="copy">Kopieren</button><button data-menu="cut">Ausschneiden</button><button data-menu="download">Herunterladen</button><button class="danger" data-menu="remove">Löschen</button></div>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="dialog"><form method="dialog"><div class="dialog-body"><h2 id="dialog-title"></h2><p id="dialog-text"></p><input id="dialog-input" autocomplete="off"></div><div class="dialog-actions"><button value="cancel">Abbrechen</button><button id="dialog-confirm" class="primary" value="confirm">Erstellen</button></div></form></dialog>
  <script>
    const $ = selector => document.querySelector(selector);
    const els = {address:$('#address'), addressForm:$('#address-form'), back:$('#back'), forward:$('#forward'), up:$('#up'), refresh:$('#refresh'), places:$('#places'), crumbs:$('#crumbs'), search:$('#search'), clearSearch:$('#clear-search'), entries:$('#entries'), list:$('#list'), preview:$('#preview'), status:$('#status'), clipboard:$('#clipboard-status'), context:$('#context-menu'), toast:$('#toast'), dialog:$('#dialog'), dialogTitle:$('#dialog-title'), dialogText:$('#dialog-text'), dialogInput:$('#dialog-input'), dialogConfirm:$('#dialog-confirm'), newFolder:$('#new-folder'), newFile:$('#new-file'), open:$('#open'), rename:$('#rename'), copy:$('#copy'), cut:$('#cut'), paste:$('#paste'), download:$('#download'), remove:$('#remove')};
    const state = {path:'/', history:['/'], historyIndex:0, files:[], visible:[], selected:new Set(), clipboard:null, previewToken:0, refreshTimer:null};
    let sequence = 0, toastTimer = 0;
    function request(action,args={}){return new Promise((resolve,reject)=>{const id='files-'+(++sequence);const timeout=setTimeout(()=>{removeEventListener('message',onMessage);reject(new Error('Das Betriebssystem antwortet nicht.'));},8000);function onMessage(event){const msg=event.data;if(msg?.os==='response'&&msg.id===id){clearTimeout(timeout);removeEventListener('message',onMessage);msg.ok?resolve(msg.result):reject(new Error(msg.error||'Unbekannter Fehler'));}}addEventListener('message',onMessage);parent.postMessage({os:'request',id,type:'fs',action,args},'*');});}
    function system(action,args={}){return new Promise((resolve,reject)=>{const id='system-'+(++sequence);function onMessage(event){const msg=event.data;if(msg?.os==='response'&&msg.id===id){removeEventListener('message',onMessage);msg.ok?resolve(msg.result):reject(new Error(msg.error||'Unbekannter Fehler'));}}addEventListener('message',onMessage);parent.postMessage({os:'request',id,type:'system',action,...args},'*');});}
    function normalize(path){const output=[];String(path||'').split('/').forEach(part=>{if(!part||part==='.')return;if(part==='..')output.pop();else output.push(part);});return '/'+output.join('/');} function parentPath(path){path=normalize(path);if(path==='/')return '/';const i=path.lastIndexOf('/');return i===0?'/':path.slice(0,i);} function nameOf(path){return normalize(path).split('/').filter(Boolean).pop()||'/';} function join(path,name){return normalize((path==='/'?'':path)+'/'+name);}
    function isText(file){return file.type==='file'&&(!/\.[^/.]+$/.test(nameOf(file.path))||/\.(txt|md|markdown|json|js|html|css|csv|xml|yml|yaml|log)$/i.test(file.path));} function iconFor(file){if(file.type==='dir')return '📁';const ext=(nameOf(file.path).split('.').pop()||'').toLowerCase();if(['txt','md','log'].includes(ext))return '📄';if(['js','html','css','json','xml','yml','yaml'].includes(ext))return '⌘';if(ext==='csv')return '▦';return '📃';} function typeFor(file){if(file.type==='dir')return 'Ordner';const ext=(nameOf(file.path).match(/\.([^.]*)$/)||[])[1];return ext?ext.toUpperCase()+'-Datei':'Datei';} function bytes(value){const n=new TextEncoder().encode(value||'').length;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(n<10240?1:0)+' KB';return(n/1048576).toFixed(1)+' MB';} function when(value){if(!value)return '—';const date=new Date(value);return Number.isNaN(+date)?'—':new Intl.DateTimeFormat('de-DE',{dateStyle:'short',timeStyle:'short'}).format(date);}
    function message(text,error=false){clearTimeout(toastTimer);els.toast.textContent=text;els.toast.className='toast show'+(error?' error':'');toastTimer=setTimeout(()=>els.toast.className='toast',3200);} function setStatus(text){els.status.textContent=text;} function validName(value){const name=String(value||'').trim();if(!name||name==='.'||name==='..'||/[\\/\0]/.test(name))throw new Error('Bitte gib einen gültigen Namen ohne Schrägstrich ein.');return name;} function selectedFiles(){return state.files.filter(file=>state.selected.has(file.path));}
    async function pushPath(path){path=normalize(path);if(path===state.path)return refresh();try{const target=await request('stat',{path});if(!target)throw new Error('Der Ordner wurde nicht gefunden.');if(target.type!=='dir')throw new Error('Dieser Pfad ist kein Ordner.');state.path=path;state.history=state.history.slice(0,state.historyIndex+1);state.history.push(path);state.historyIndex=state.history.length-1;state.selected.clear();els.search.value='';await refresh();}catch(error){message(error.message,true);}}
    async function refresh(){try{setStatus('Aktualisiere …');state.files=await request('list',{path:state.path});state.files.sort((a,b)=>(a.type===b.type?nameOf(a.path).localeCompare(nameOf(b.path),'de',{sensitivity:'base'}):a.type==='dir'?-1:1));state.selected=new Set([...state.selected].filter(path=>state.files.some(file=>file.path===path)));render();renderPlaces();setStatus(`${state.files.length} ${state.files.length===1?'Element':'Elemente'}`);}catch(error){message(error.message,true);setStatus('Ordner konnte nicht geladen werden.');}}
    function render(){els.address.value=state.path;els.back.disabled=state.historyIndex===0;els.forward.disabled=state.historyIndex>=state.history.length-1;els.up.disabled=state.path==='/';els.clearSearch.disabled=!els.search.value;renderCrumbs();const term=els.search.value.trim().toLocaleLowerCase('de');state.visible=state.files.filter(file=>nameOf(file.path).toLocaleLowerCase('de').includes(term));els.entries.replaceChildren();if(!state.visible.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<div class="empty-icon">'+(term?'⌕':'📂')+'</div><h2>'+ (term?'Nichts gefunden':'Dieser Ordner ist leer') +'</h2><p>'+ (term?'Passe den Suchbegriff an oder lösche die Suche.':'Erstelle einen Ordner oder eine Datei, um loszulegen.') +'</p>';els.entries.append(empty);}else for(const file of state.visible)els.entries.append(entryFor(file));updateActions();renderPreview();}
    function entryFor(file){const row=document.createElement('button');row.className='entry'+(state.selected.has(file.path)?' selected':'');row.dataset.path=file.path;row.title=nameOf(file.path);const n=document.createElement('span');n.className='file-name';const i=document.createElement('span');i.className='file-icon';i.textContent=iconFor(file);const label=document.createElement('span');label.textContent=nameOf(file.path);n.append(i,label);const type=document.createElement('span');type.className='muted';type.textContent=typeFor(file);const changed=document.createElement('span');changed.className='muted';changed.textContent=when(file.updatedAt);row.append(n,type,changed);row.addEventListener('click',event=>select(file,event));row.addEventListener('dblclick',()=>openFile(file));row.addEventListener('contextmenu',event=>{event.preventDefault();if(!state.selected.has(file.path)){state.selected.clear();state.selected.add(file.path);render();}openMenu(event.clientX,event.clientY);});return row;}
    function select(file,event){if(event.metaKey||event.ctrlKey){state.selected.has(file.path)?state.selected.delete(file.path):state.selected.add(file.path);}else{state.selected.clear();state.selected.add(file.path);}render();} function renderCrumbs(){els.crumbs.replaceChildren();const root=document.createElement('button');root.className='crumb';root.textContent='Dieser PC';root.onclick=()=>pushPath('/');els.crumbs.append(root);let acc='';for(const part of state.path.split('/').filter(Boolean)){const sep=document.createElement('span');sep.className='chevron';sep.textContent='›';els.crumbs.append(sep);acc+='/'+part;const button=document.createElement('button');button.className='crumb';button.textContent=part;button.onclick=()=>pushPath(acc);els.crumbs.append(button);}}
    function renderPlaces(){els.places.replaceChildren();const add=(path,label,icon)=>{const button=document.createElement('button');button.className='side-item'+(state.path===path?' active':'');button.innerHTML='<span class="side-icon"></span><span></span>';button.querySelector('.side-icon').textContent=icon;button.querySelector('span:last-child').textContent=label;button.onclick=()=>pushPath(path);els.places.append(button);};add('/','Alle Dateien','⌂');for(const file of state.files.filter(file=>file.type==='dir'))add(file.path,nameOf(file.path),'📁');} function updateActions(){const chosen=selectedFiles(),single=chosen.length===1,file=chosen[0];els.open.disabled=!single;els.rename.disabled=!single;els.copy.disabled=!chosen.length;els.cut.disabled=!chosen.length;els.remove.disabled=!chosen.length;els.download.disabled=!(single&&file?.type==='file');els.paste.disabled=!state.clipboard?.items?.length;els.clipboard.textContent=state.clipboard?`${state.clipboard.items.length} ${state.clipboard.items.length===1?'Element':'Elemente'} ${state.clipboard.mode==='cut'?'zum Verschieben':'kopiert'}`:'';}
    async function renderPreview(){const token=++state.previewToken;const files=selectedFiles();els.preview.replaceChildren();if(files.length!==1){els.preview.className='preview-empty';els.preview.textContent=files.length?`${files.length} Elemente ausgewählt.`:'Wähle eine Datei oder einen Ordner aus.';return;}const file=files[0],card=document.createElement('div');card.className='preview-card';const icon=document.createElement('div');icon.className='preview-icon';icon.textContent=iconFor(file);const name=document.createElement('div');name.className='preview-name';name.textContent=nameOf(file.path);const meta=document.createElement('div');meta.className='preview-meta';meta.innerHTML='<span></span><span></span>';meta.children[0].textContent=typeFor(file);meta.children[1].textContent=file.type==='file'?bytes(file.data):'Ordner';card.append(icon,name,meta);els.preview.className='';els.preview.append(card);if(isText(file)){try{const content=await request('readFile',{path:file.path});if(token!==state.previewToken)return;const pre=document.createElement('div');pre.className='preview-text';pre.textContent=content.length>3000?content.slice(0,3000)+'\n\n… Vorschau gekürzt':content||'Leere Datei';card.append(pre);}catch{}}}
    function openMenu(x,y){els.context.classList.remove('hidden');const rect=els.context.getBoundingClientRect();els.context.style.left=Math.min(x,innerWidth-rect.width-8)+'px';els.context.style.top=Math.min(y,innerHeight-rect.height-8)+'px';} function closeMenu(){els.context.classList.add('hidden');} function ask({title,text,value='',confirm='OK',danger=false}){return new Promise(resolve=>{els.dialogTitle.textContent=title;els.dialogText.textContent=text;els.dialogInput.value=value||'';els.dialogInput.style.display=value===null?'none':'';els.dialogConfirm.textContent=confirm;els.dialogConfirm.className=(danger?'danger':'primary');const done=()=>{const answer=els.dialog.returnValue==='confirm'?(value===null?true:els.dialogInput.value):null;els.dialog.removeEventListener('close',done);resolve(answer);};els.dialog.addEventListener('close',done);els.dialog.showModal();if(value!==null)setTimeout(()=>{els.dialogInput.focus();els.dialogInput.select();},0);});}
    async function createFolder(){const value=await ask({title:'Neuer Ordner',text:'Wie soll der Ordner heißen?',value:'Neuer Ordner',confirm:'Erstellen'});if(value===null)return;try{await request('mkdir',{path:join(state.path,validName(value))});message('Ordner erstellt.');await refresh();}catch(error){message(error.message,true);}} async function createFile(){const value=await ask({title:'Neue Datei',text:'Zum Beispiel: Ideen.txt',value:'Neue Notiz.txt',confirm:'Erstellen'});if(value===null)return;try{const path=join(state.path,validName(value));await request('writeFile',{path,data:''});message('Datei erstellt.');await refresh();state.selected.add(path);render();}catch(error){message(error.message,true);}}
    async function rename(){const [file]=selectedFiles();if(!file)return;const value=await ask({title:'Umbenennen',text:'Neuer Name für „'+nameOf(file.path)+'“',value:nameOf(file.path),confirm:'Umbenennen'});if(value===null)return;try{await request('mv',{src:file.path,dst:join(parentPath(file.path),validName(value))});message('Umbenannt.');await refresh();}catch(error){message(error.message,true);}} async function remove(){const files=selectedFiles();if(!files.length)return;const answer=await ask({title:'Wirklich löschen?',text:`${files.length} ${files.length===1?'Element':'Elemente'} werden endgültig aus WebOS entfernt.`,value:null,confirm:'Löschen',danger:true});if(!answer)return;try{for(const file of files)await request('rm',{path:file.path});state.selected.clear();message('Gelöscht.');await refresh();}catch(error){message(error.message,true);}}
    function copy(mode){const files=selectedFiles();if(!files.length)return;state.clipboard={mode,items:files.map(file=>({...file}))};updateActions();message(mode==='cut'?'Zum Verschieben vorgemerkt.':'In die Zwischenablage kopiert.');} async function unusedTarget(name){let candidate=join(state.path,name);if(!await request('stat',{path:candidate}))return candidate;const dot=name.lastIndexOf('.'),stem=dot>0?name.slice(0,dot):name,extension=dot>0?name.slice(dot):'';let n=2;while(await request('stat',{path:join(state.path,`${stem} (${n})${extension}`)}))n++;return join(state.path,`${stem} (${n})${extension}`);} async function paste(){const clip=state.clipboard;if(!clip?.items?.length)return;let count=0;try{for(const file of clip.items){const target=await unusedTarget(nameOf(file.path));await request(clip.mode==='cut'?'mv':'cp',{src:file.path,dst:target});count++;}if(clip.mode==='cut')state.clipboard=null;message(`${count} ${count===1?'Element eingefügt':'Elemente eingefügt'}.`);await refresh();}catch(error){message(`${count?'Teilweise eingefügt: ':''}${error.message}`,true);await refresh();}}
    async function openFile(file=selectedFiles()[0]){if(!file)return;if(file.type==='dir'){pushPath(file.path);return;}if(isText(file)){try{await system('openApp',{appId:'notes',data:{path:file.path}});message('Datei wird in Notizen geöffnet.');}catch(error){message(error.message,true);}}else message('Für diesen Dateityp gibt es noch keine passende Anwendung.',true);} async function download(){const [file]=selectedFiles();if(!file||file.type!=='file')return;try{const data=await request('readFile',{path:file.path});const url=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=nameOf(file.path);a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('Download gestartet.');}catch(error){message(error.message,true);}}
    els.addressForm.addEventListener('submit',event=>{event.preventDefault();pushPath(els.address.value);});els.back.onclick=()=>{if(state.historyIndex>0){state.path=state.history[--state.historyIndex];state.selected.clear();refresh();}};els.forward.onclick=()=>{if(state.historyIndex<state.history.length-1){state.path=state.history[++state.historyIndex];state.selected.clear();refresh();}};els.up.onclick=()=>pushPath(parentPath(state.path));els.refresh.onclick=refresh;els.search.oninput=render;els.clearSearch.onclick=()=>{els.search.value='';render();els.search.focus();};els.newFolder.onclick=createFolder;els.newFile.onclick=createFile;els.open.onclick=()=>openFile();els.rename.onclick=rename;els.copy.onclick=()=>copy('copy');els.cut.onclick=()=>copy('cut');els.paste.onclick=paste;els.remove.onclick=remove;els.download.onclick=download;
    els.context.addEventListener('click',event=>{const action=event.target.dataset.menu;if(!action)return;closeMenu();({open:()=>openFile(),rename,copy:()=>copy('copy'),cut:()=>copy('cut'),remove,download})[action]?.();});document.addEventListener('pointerdown',event=>{if(!els.context.contains(event.target))closeMenu();});addEventListener('keydown',event=>{if(els.dialog.open)return;const editing=document.activeElement===els.address||document.activeElement===els.search;if(event.altKey&&event.key==='ArrowLeft'){event.preventDefault();els.back.click();}else if(event.altKey&&event.key==='ArrowRight'){event.preventDefault();els.forward.click();}else if(event.ctrlKey&&event.key.toLowerCase()==='l'){event.preventDefault();els.address.focus();els.address.select();}else if(event.ctrlKey&&event.key.toLowerCase()==='c'&&!editing){event.preventDefault();copy('copy');}else if(event.ctrlKey&&event.key.toLowerCase()==='x'&&!editing){event.preventDefault();copy('cut');}else if(event.ctrlKey&&event.key.toLowerCase()==='v'&&!editing){event.preventDefault();paste();}else if(event.key==='Delete'&&!editing){event.preventDefault();remove();}else if(event.key==='F2'&&!editing){event.preventDefault();rename();}else if(event.key==='Enter'&&!editing&&selectedFiles().length===1){event.preventDefault();openFile();}else if(event.key==='Escape'){state.selected.clear();render();}});addEventListener('message',event=>{const msg=event.data;if(msg?.os==='event'&&msg.type==='fs-changed'){clearTimeout(state.refreshTimer);state.refreshTimer=setTimeout(refresh,80);}});refresh();
  </script>

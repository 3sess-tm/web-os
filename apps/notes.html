<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notizen</title>
  <style>
    :root{--ink:#27313d;--muted:#718092;--line:#dce4ec;--panel:#f7f9fb;--blue:#276ee9;--blue-soft:#eaf2ff;--paper:#fffaf0;--shadow:0 8px 24px rgba(34,51,72,.11)}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff}button,input,textarea{font:inherit}button{color:inherit}.app{height:100%;min-width:460px;display:flex;flex-direction:column}.topbar{padding:9px 11px 8px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center;background:#fff}.doc-name{min-width:100px;flex:1;height:31px;border:1px solid transparent;background:transparent;border-radius:7px;padding:0 8px;font-weight:650;color:var(--ink);outline:0}.doc-name:hover{background:var(--panel)}.doc-name:focus{background:#fff;border-color:#9bc0f8;box-shadow:0 0 0 3px rgba(39,110,233,.1)}.tool{min-height:31px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:5px 9px;cursor:pointer;white-space:nowrap}.tool:hover:not(:disabled){background:var(--panel);border-color:#c8d5e2}.tool.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:650}.tool.primary:hover{background:#155fda}.tool.active{color:#175dc8;background:var(--blue-soft);border-color:#bfd6fa}.tool:disabled{opacity:.48;cursor:default}.formatbar{display:flex;align-items:center;gap:5px;padding:6px 11px;border-bottom:1px solid var(--line);background:#fbfcfd;overflow:auto}.formatbar .icon{width:30px;padding:4px 0;font-weight:700}.formatbar .separator{height:19px;width:1px;background:var(--line);margin:0 2px}.shortcut{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}.findbar{display:none;align-items:center;gap:6px;padding:6px 11px;border-bottom:1px solid var(--line);background:#fff7e8}.findbar.show{display:flex}.findbar input{height:29px;min-width:90px;flex:1;border:1px solid #e8d5ae;border-radius:6px;padding:0 8px;outline:0}.findbar input:focus{border-color:#cf9a34;box-shadow:0 0 0 3px rgba(207,154,52,.13)}.find-count{font-size:12px;color:var(--muted);white-space:nowrap}.workspace{min-height:0;flex:1;display:grid;grid-template-columns:180px minmax(230px,1fr)}.sidebar{min-height:0;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:11px 8px}.sidebar-heading{display:flex;align-items:center;justify-content:space-between;padding:2px 7px 7px;font-size:11px;text-transform:uppercase;letter-spacing:.065em;color:#8592a2;font-weight:700}.sidebar-heading button{border:0;background:transparent;color:var(--blue);font-size:18px;cursor:pointer;line-height:1;padding:0 3px}.note-list{display:grid;gap:2px}.note-item{width:100%;border:0;background:transparent;border-radius:7px;padding:7px;text-align:left;cursor:pointer;display:grid;grid-template-columns:17px minmax(0,1fr);gap:6px}.note-item:hover{background:#edf2f7}.note-item.active{background:var(--blue-soft);color:#195fc9}.note-item .note-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.note-item .note-path{grid-column:2;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note-item.active .note-path{color:#5d86c6}.sidebar-empty{padding:11px 7px;color:var(--muted);font-size:12px}.editor-pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--paper)}.pathline{height:30px;padding:7px 13px;border-bottom:1px solid #eee7da;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fffdf8}.editor-wrap{min-height:0;flex:1;position:relative;display:flex}.line-numbers{display:block;flex:0 0 44px;margin:0;padding:13px 8px 20px 0;overflow:hidden;text-align:right;background:#f6f2e9;border-right:1px solid #ede6d9;color:#aaa295;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;user-select:none}.editor{min-width:0;min-height:0;flex:1;resize:none;border:0;outline:0;padding:13px 16px 40px;background:var(--paper);color:#303a46;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;tab-size:2}.editor::selection{background:#bfd7ff}.preview{display:none;min-height:0;flex:1;overflow:auto;padding:23px max(28px,7%);background:var(--paper);font-size:14px;line-height:1.65}.preview.show{display:block}.preview h1,.preview h2,.preview h3{line-height:1.25;margin:1.2em 0 .55em}.preview h1{font-size:1.75em}.preview h2{font-size:1.35em}.preview h3{font-size:1.12em}.preview p{margin:.6em 0}.preview ul{padding-left:1.4em}.preview code{padding:1px 4px;border-radius:4px;background:#eee8dc;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.preview pre{overflow:auto;padding:11px;border-radius:7px;background:#2b3440;color:#eff4fa}.preview pre code{background:none;padding:0}.preview blockquote{margin:10px 0;padding:3px 12px;border-left:3px solid #81a9ed;color:#627386}.preview a{color:var(--blue)}.status{height:28px;padding:5px 11px;border-top:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:15px;color:var(--muted);font-size:11px}.status .saved{color:#39835b}.status .dirty{color:#b27312}.status .status-right{margin-left:auto}.toast{position:fixed;z-index:10;left:50%;bottom:11px;transform:translate(-50%,20px);max-width:calc(100% - 28px);padding:8px 12px;border-radius:8px;background:#283949;color:#fff;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#963745}dialog{border:0;padding:0;border-radius:12px;box-shadow:0 18px 55px rgba(22,36,53,.27);width:min(390px,calc(100vw - 32px));color:var(--ink)}dialog::backdrop{background:rgba(16,27,39,.26)}.dialog-body{padding:18px}.dialog-body h2{margin:0 0 6px;font-size:16px}.dialog-body p{margin:0 0 14px;color:var(--muted)}.dialog-body input{height:34px;width:100%;border:1px solid var(--line);border-radius:7px;padding:0 9px;outline:0}.dialog-body input:focus{border-color:#9bc0f8;box-shadow:0 0 0 3px rgba(39,110,233,.1)}.dialog-actions{display:flex;justify-content:flex-end;gap:7px;padding:0 18px 16px}.dialog-actions button{border:1px solid var(--line);border-radius:7px;background:#fff;padding:6px 10px;cursor:pointer}.dialog-actions button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.dialog-actions button.danger{background:#c53b4a;border-color:#c53b4a;color:#fff}@media(max-width:620px){.workspace{grid-template-columns:135px minmax(220px,1fr)}.topbar .optional,.formatbar .optional{display:none}.shortcut{display:none}.line-numbers{flex-basis:34px;font-size:11px}.editor{padding-left:10px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="tool" id="new-note">Neu</button>
      <button class="tool optional" id="open-files">Dateien</button>
      <input id="doc-name" class="doc-name" aria-label="Dateiname" value="Neue Notiz" spellcheck="false">
      <button class="tool optional" id="rename" title="Umbenennen">Umbenennen</button>
      <button class="tool" id="save-as">Speichern unter</button>
      <button class="tool primary" id="save">Speichern</button>
    </header>
    <nav class="formatbar" aria-label="Editor-Werkzeuge">
      <button class="tool icon" id="heading" title="Überschrift einfügen">H</button><button class="tool icon" id="bold" title="Fett markieren">B</button><button class="tool icon" id="italic" title="Kursiv markieren"><i>I</i></button><span class="separator"></span><button class="tool icon" id="bullets" title="Aufzählung">☷</button><button class="tool icon optional" id="checklist" title="Checkliste">☑</button><button class="tool icon optional" id="code" title="Code">&lt;/&gt;</button><span class="separator optional"></span><button class="tool" id="find" title="Suchen (Strg + F)">Suchen</button><button class="tool" id="preview-toggle" title="Markdown-Vorschau">Vorschau</button><span class="shortcut">Strg + S zum Speichern</span>
    </nav>
    <section class="findbar" id="findbar"><input id="find-input" placeholder="Suchen …" aria-label="Suchen"><input id="replace-input" placeholder="Ersetzen durch …" aria-label="Ersetzen"><span class="find-count" id="find-count"></span><button class="tool" id="find-prev" title="Vorheriger Treffer">↑</button><button class="tool" id="find-next" title="Nächster Treffer">↓</button><button class="tool optional" id="replace-one">Ersetzen</button><button class="tool optional" id="replace-all">Alle</button><button class="tool" id="find-close" aria-label="Suche schließen">×</button></section>
    <section class="workspace">
      <aside class="sidebar"><div class="sidebar-heading"><span>Notizen</span><button id="sidebar-new" title="Neue Notiz" aria-label="Neue Notiz">＋</button></div><div class="note-list" id="note-list"></div><div class="sidebar-empty" id="sidebar-empty">Noch keine gespeicherten Notizen.</div></aside>
      <section class="editor-pane"><div id="pathline" class="pathline">Nicht gespeichert</div><div class="editor-wrap"><pre id="line-numbers" class="line-numbers" aria-hidden="true">1</pre><textarea id="editor" class="editor" spellcheck="true" placeholder="Schreibe eine Notiz …"></textarea><article id="preview" class="preview"></article></div></section>
    </section>
    <footer class="status"><span id="save-state" class="saved">Bereit</span><span id="document-stats">0 Wörter · 0 Zeichen · 1 Zeile</span><span class="status-right" id="caret-state">Zeile 1, Spalte 1</span></footer>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="dialog"><form method="dialog"><div class="dialog-body"><h2 id="dialog-title"></h2><p id="dialog-text"></p><input id="dialog-input" autocomplete="off"></div><div class="dialog-actions"><button value="cancel">Abbrechen</button><button id="dialog-confirm" class="primary" value="confirm">Speichern</button></div></form></dialog>
  <script>
    const $ = selector => document.querySelector(selector);
    const els={editor:$('#editor'),lineNumbers:$('#line-numbers'),docName:$('#doc-name'),pathline:$('#pathline'),save:$('#save'),saveAs:$('#save-as'),rename:$('#rename'),newNote:$('#new-note'),sidebarNew:$('#sidebar-new'),openFiles:$('#open-files'),noteList:$('#note-list'),sidebarEmpty:$('#sidebar-empty'),saveState:$('#save-state'),stats:$('#document-stats'),caret:$('#caret-state'),preview:$('#preview'),previewToggle:$('#preview-toggle'),findbar:$('#findbar'),findInput:$('#find-input'),replaceInput:$('#replace-input'),findCount:$('#find-count'),toast:$('#toast'),dialog:$('#dialog'),dialogTitle:$('#dialog-title'),dialogText:$('#dialog-text'),dialogInput:$('#dialog-input'),dialogConfirm:$('#dialog-confirm')};
    const state={path:null,dirty:false,preview:false,files:[],saving:false,autoSaveTimer:null,refreshTimer:null};let sequence=0,toastTimer=0;
    function request(action,args={}){return new Promise((resolve,reject)=>{const id='notes-'+(++sequence);const timeout=setTimeout(()=>{removeEventListener('message',onMessage);reject(new Error('Das Betriebssystem antwortet nicht.'));},8000);function onMessage(event){const msg=event.data;if(msg?.os==='response'&&msg.id===id){clearTimeout(timeout);removeEventListener('message',onMessage);msg.ok?resolve(msg.result):reject(new Error(msg.error||'Unbekannter Fehler'));}}addEventListener('message',onMessage);parent.postMessage({os:'request',id,type:'fs',action,args},'*');});}
    function system(action,args={}){return new Promise((resolve,reject)=>{const id='notes-system-'+(++sequence);function onMessage(event){const msg=event.data;if(msg?.os==='response'&&msg.id===id){removeEventListener('message',onMessage);msg.ok?resolve(msg.result):reject(new Error(msg.error||'Unbekannter Fehler'));}}addEventListener('message',onMessage);parent.postMessage({os:'request',id,type:'system',action,...args},'*');});}
    function normalize(path){const out=[];String(path||'').split('/').forEach(part=>{if(!part||part==='.')return;if(part==='..')out.pop();else out.push(part);});return '/'+out.join('/');}function nameOf(path){return normalize(path).split('/').filter(Boolean).pop()||'Neue Notiz';}function parentOf(path){const n=normalize(path),i=n.lastIndexOf('/');return i<=0?'/':n.slice(0,i);}function isText(file){return file.type==='file'&&(!/\.[^/.]+$/.test(file.path)||/\.(txt|md|markdown|json|js|html|css|csv|xml|yml|yaml|log)$/i.test(file.path));}
    function toast(text,error=false){clearTimeout(toastTimer);els.toast.textContent=text;els.toast.className='toast show'+(error?' error':'');toastTimer=setTimeout(()=>els.toast.className='toast',3200);}function setSaveState(text,kind='saved'){els.saveState.textContent=text;els.saveState.className=kind;}
    function ask({title,text,value='',confirm='OK',danger=false}){return new Promise(resolve=>{els.dialogTitle.textContent=title;els.dialogText.textContent=text;els.dialogInput.value=value||'';els.dialogInput.style.display=value===null?'none':'';els.dialogConfirm.textContent=confirm;els.dialogConfirm.className=danger?'danger':'primary';const done=()=>{const answer=els.dialog.returnValue==='confirm'?(value===null?true:els.dialogInput.value):null;els.dialog.removeEventListener('close',done);resolve(answer);};els.dialog.addEventListener('close',done);els.dialog.showModal();if(value!==null)setTimeout(()=>{els.dialogInput.focus();els.dialogInput.select();},0);});}
    function refreshChrome(){els.docName.value=state.path?nameOf(state.path):'Neue Notiz';els.pathline.textContent=state.path||'Nicht gespeichert';document.title=(state.path?nameOf(state.path):'Neue Notiz')+' – Notizen';if(state.saving)setSaveState('Speichert …');else if(state.dirty)setSaveState('Nicht gespeichert','dirty');else setSaveState(state.path?'Gespeichert':'Bereit','saved');els.rename.disabled=!state.path;els.previewToggle.classList.toggle('active',state.preview);els.previewToggle.textContent=state.preview?'Editor':'Vorschau';}
    function updateStats(){const text=els.editor.value,lines=text.split('\n').length,words=(text.trim().match(/\S+/g)||[]).length,chars=text.length;els.stats.textContent=`${words} ${words===1?'Wort':'Wörter'} · ${chars} ${chars===1?'Zeichen':'Zeichen'} · ${lines} ${lines===1?'Zeile':'Zeilen'}`;const selection=els.editor.selectionStart;const before=text.slice(0,selection);els.caret.textContent=`Zeile ${before.split('\n').length}, Spalte ${selection-before.lastIndexOf('\n')}`;const rendered=Array.from({length:Math.max(lines,1)},(_,index)=>index+1).join('\n');els.lineNumbers.textContent=rendered;}
    function change(){state.dirty=true;refreshChrome();updateStats();if(state.preview)renderPreview();clearTimeout(state.autoSaveTimer);if(state.path)state.autoSaveTimer=setTimeout(()=>save(true),1400);}
    function escapeHTML(value){return String(value).replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));}function inline(value){return escapeHTML(value).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');}
    function markdown(value){const lines=value.replace(/\r/g,'').split('\n');let html='',list=false,code=false;for(const raw of lines){if(raw.startsWith('```')){if(code){html+='</code></pre>';code=false;}else{html+='<pre><code>';code=true;}continue;}if(code){html+=escapeHTML(raw)+'\n';continue;}if(/^[-*]\s+/.test(raw)){if(!list){html+='<ul>';list=true;}html+='<li>'+inline(raw.replace(/^[-*]\s+/,''))+'</li>';continue;}if(list){html+='</ul>';list=false;}if(/^###\s+/.test(raw))html+='<h3>'+inline(raw.slice(4))+'</h3>';else if(/^##\s+/.test(raw))html+='<h2>'+inline(raw.slice(3))+'</h2>';else if(/^#\s+/.test(raw))html+='<h1>'+inline(raw.slice(2))+'</h1>';else if(/^>\s?/.test(raw))html+='<blockquote>'+inline(raw.replace(/^>\s?/,''))+'</blockquote>';else if(raw.trim())html+='<p>'+inline(raw)+'</p>';else html+='<br>';}if(list)html+='</ul>';if(code)html+='</code></pre>';return html;}
    function renderPreview(){els.preview.innerHTML=markdown(els.editor.value)||'<p><em>Diese Notiz ist leer.</em></p>';}
    function showPreview(enabled=!state.preview){state.preview=enabled;els.editor.style.display=enabled?'none':'';els.lineNumbers.style.display=enabled?'none':'';els.preview.classList.toggle('show',enabled);if(enabled)renderPreview();refreshChrome();}
    async function listNotes(){async function walk(path){const entries=await request('list',{path});const found=[];for(const entry of entries){if(entry.type==='dir')found.push(...await walk(entry.path));else if(isText(entry))found.push(entry);}return found;}try{state.files=(await walk('/')).sort((a,b)=>nameOf(a.path).localeCompare(nameOf(b.path),'de',{sensitivity:'base'}));renderList();}catch(error){toast(error.message,true);}}
    function renderList(){els.noteList.replaceChildren();els.sidebarEmpty.hidden=state.files.length>0;for(const file of state.files){const button=document.createElement('button');button.className='note-item'+(state.path===file.path?' active':'');button.title=file.path;button.innerHTML='<span>📝</span><span class="note-title"></span><span class="note-path"></span>';button.querySelector('.note-title').textContent=nameOf(file.path);button.querySelector('.note-path').textContent=parentOf(file.path);button.onclick=()=>openPath(file.path);els.noteList.append(button);}}
    async function shouldDiscard(){if(!state.dirty)return true;const answer=await ask({title:'Änderungen verwerfen?',text:'Diese Notiz hat ungespeicherte Änderungen.',value:null,confirm:'Verwerfen',danger:true});return Boolean(answer);}
    async function newNote(){if(!await shouldDiscard())return;clearTimeout(state.autoSaveTimer);state.path=null;state.dirty=false;els.editor.value='';showPreview(false);updateStats();refreshChrome();renderList();els.editor.focus();}
    async function openPath(path){path=normalize(path);if(path===state.path)return;if(!await shouldDiscard())return;try{const data=await request('readFile',{path});state.path=path;state.dirty=false;els.editor.value=data;showPreview(false);updateStats();refreshChrome();renderList();els.editor.focus();}catch(error){toast(error.message,true);}}
    function validPath(value){const path=normalize(value);if(path==='/'||String(value||'').includes('\0'))throw new Error('Bitte gib einen gültigen Dateipfad ein.');return path;}
    async function save(auto=false){if(state.saving)return;if(!state.path)return saveAs();state.saving=true;refreshChrome();try{await request('writeFile',{path:state.path,data:els.editor.value});state.dirty=false;if(!auto)toast('Gespeichert.');await listNotes();}catch(error){toast(error.message,true);setSaveState('Speichern fehlgeschlagen','dirty');}finally{state.saving=false;refreshChrome();}}
    async function saveAs(){const defaultPath=state.path||'/Neue Notiz.txt';const value=await ask({title:'Speichern unter',text:'Dateipfad in WebOS',value:defaultPath,confirm:'Speichern'});if(value===null)return;try{state.path=validPath(value);await save();}catch(error){toast(error.message,true);}}
    async function rename(nextName=null){if(!state.path)return;const value=nextName===null?await ask({title:'Datei umbenennen',text:'Neuer Dateiname',value:nameOf(state.path),confirm:'Umbenennen'}):nextName;if(value===null)return;const name=String(value).trim();if(!name||/[\\/\0]/.test(name)){toast('Bitte gib einen gültigen Namen ohne Schrägstrich ein.',true);refreshChrome();return;}if(name===nameOf(state.path)){refreshChrome();return;}try{const next=normalize(parentOf(state.path)+'/'+name);await request('mv',{src:state.path,dst:next});state.path=next;state.dirty=false;await listNotes();refreshChrome();toast('Umbenannt.');}catch(error){toast(error.message,true);refreshChrome();}}
    function surround(before,after=before,placeholder='Text'){const start=els.editor.selectionStart,end=els.editor.selectionEnd,text=els.editor.value,selected=text.slice(start,end)||placeholder;els.editor.setRangeText(before+selected+after,start,end,'end');els.editor.focus();change();}function prefix(prefix){const start=els.editor.selectionStart,end=els.editor.selectionEnd,text=els.editor.value;const lineStart=text.lastIndexOf('\n',start-1)+1;const lineEnd=text.indexOf('\n',end);const block=text.slice(lineStart,lineEnd<0?text.length:lineEnd).split('\n').map(line=>prefix+line).join('\n');els.editor.setRangeText(block,lineStart,lineEnd<0?text.length:lineEnd,'preserve');els.editor.focus();change();}
    function openFind(){els.findbar.classList.add('show');els.findInput.focus();els.findInput.select();updateFindCount();}function closeFind(){els.findbar.classList.remove('show');els.editor.focus();}function matches(){const query=els.findInput.value;if(!query)return[];const lower=els.editor.value.toLocaleLowerCase('de'),needle=query.toLocaleLowerCase('de'),hits=[];let at=0;while((at=lower.indexOf(needle,at))>=0){hits.push(at);at+=needle.length||1;}return hits;}function updateFindCount(){const hits=matches();els.findCount.textContent=els.findInput.value?`${hits.length} Treffer`:'';return hits;}function goMatch(direction=1){const hits=updateFindCount();if(!hits.length){toast('Kein Treffer gefunden.');return;}const pos=els.editor.selectionStart;let target=direction>0?hits.find(hit=>hit>pos):[...hits].reverse().find(hit=>hit<pos);if(target===undefined)target=direction>0?hits[0]:hits.at(-1);els.editor.focus();els.editor.setSelectionRange(target,target+els.findInput.value.length);const line=els.editor.value.slice(0,target).split('\n').length;els.editor.scrollTop=Math.max(0,(line-3)*20);}function replaceOne(){if(!els.findInput.value)return;const start=els.editor.selectionStart,end=els.editor.selectionEnd;if(els.editor.value.slice(start,end).toLocaleLowerCase('de')===els.findInput.value.toLocaleLowerCase('de')){els.editor.setRangeText(els.replaceInput.value,start,end,'end');change();}goMatch(1);}function replaceAll(){const query=els.findInput.value;if(!query)return;const escaped=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const result=els.editor.value.replace(new RegExp(escaped,'gi'),els.replaceInput.value);if(result===els.editor.value)return toast('Kein Treffer gefunden.');els.editor.value=result;change();updateFindCount();}
    els.editor.addEventListener('input',change);els.editor.addEventListener('scroll',()=>els.lineNumbers.scrollTop=els.editor.scrollTop);els.editor.addEventListener('click',updateStats);els.editor.addEventListener('keyup',updateStats);els.save.onclick=()=>save();els.saveAs.onclick=saveAs;els.rename.onclick=rename;els.newNote.onclick=newNote;els.sidebarNew.onclick=newNote;els.openFiles.onclick=()=>system('openApp',{appId:'files'});els.docName.addEventListener('change',()=>{if(state.path&&els.docName.value!==nameOf(state.path))rename(els.docName.value);});$('#heading').onclick=()=>prefix('# ');$('#bold').onclick=()=>surround('**');$('#italic').onclick=()=>surround('*');$('#bullets').onclick=()=>prefix('- ');$('#checklist').onclick=()=>prefix('- [ ] ');$('#code').onclick=()=>surround('`');els.previewToggle.onclick=()=>showPreview();$('#find').onclick=openFind;$('#find-close').onclick=closeFind;els.findInput.oninput=updateFindCount;$('#find-next').onclick=()=>goMatch(1);$('#find-prev').onclick=()=>goMatch(-1);$('#replace-one').onclick=replaceOne;$('#replace-all').onclick=replaceAll;
    addEventListener('keydown',event=>{if(event.ctrlKey&&event.key.toLowerCase()==='s'){event.preventDefault();save();}else if(event.ctrlKey&&event.key.toLowerCase()==='f'){event.preventDefault();openFind();}else if(event.key==='Escape'&&els.findbar.classList.contains('show')){event.preventDefault();closeFind();}else if(event.key==='Tab'&&document.activeElement===els.editor){event.preventDefault();const start=els.editor.selectionStart;els.editor.setRangeText('  ',start,start,'end');change();}});addEventListener('message',event=>{const msg=event.data;if(msg?.os!=='event')return;if(msg.type==='app-open'&&msg.data?.path)openPath(msg.data.path);if(msg.type==='fs-changed'){clearTimeout(state.refreshTimer);state.refreshTimer=setTimeout(listNotes,100);}});addEventListener('beforeunload',event=>{if(state.dirty){event.preventDefault();event.returnValue='';}});updateStats();refreshChrome();listNotes();
  </script>
